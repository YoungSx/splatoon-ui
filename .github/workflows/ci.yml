name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # Builds the package first, so the declaration and stylesheet checks run
      # against fresh output rather than whatever dist/ happened to contain.
      - name: Typecheck
        run: pnpm typecheck

      - name: Docs generation is up to date
        run: pnpm docs:check

      - name: Static checks
        run: pnpm test

      - name: Packaging and consumer smoke
        run: pnpm pack:dry-run && pnpm test:package-consumer
