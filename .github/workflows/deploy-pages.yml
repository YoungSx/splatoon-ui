name: Deploy demo to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'splatoon-ui' }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build static demo
        run: pnpm build:demo

      - name: Ensure Cloudflare Pages project
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if pnpm exec wrangler pages project list | awk '{print $1}' | grep -Fxq "${CLOUDFLARE_PROJECT_NAME}"; then
            echo "Cloudflare Pages project ${CLOUDFLARE_PROJECT_NAME} already exists."
            exit 0
          fi

          pnpm exec wrangler pages project create "${CLOUDFLARE_PROJECT_NAME}" \
            --production-branch="${GITHUB_REF_NAME}"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm exec wrangler pages deploy out \
            --project-name="${CLOUDFLARE_PROJECT_NAME}" \
            --branch="${GITHUB_REF_NAME}" \
            --commit-dirty=true
