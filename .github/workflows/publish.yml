name: Publish to npm

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          # Pinned to Node 24.7.0 to ensure npm >= 11.5.1 required for OIDC publish.
          # Node 24.7.0 bundles npm 11.5.1 per the Node.js release manifest.
          node-version: '24.7.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          npm version "$VERSION" --no-git-tag-version --ignore-scripts
          ACTUAL_VERSION="$(node -p "require('./package.json').version")"
          if [ "${ACTUAL_VERSION}" != "${VERSION}" ]; then
            echo "package.json version ${ACTUAL_VERSION} does not match tag version ${VERSION}."
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Regression tests
        run: |
          node tests/theme-role-tokens-regression.mjs
          node tests/ui-entrypoints-regression.mjs
          node tests/package-publish-regression.mjs

      - name: Build package
        run: pnpm build:package

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          # Ensure we don't accidentally publish with token auth.
          unset NODE_AUTH_TOKEN || true
          OIDC_NPMRC="${RUNNER_TEMP}/npmrc-oidc"
          : > "${OIDC_NPMRC}"
          export NPM_CONFIG_USERCONFIG="${OIDC_NPMRC}"
          npm config set registry "https://registry.npmjs.org/"

          REQUIRED_NPM="11.5.1"
          CURRENT_NPM="$(npm --version)"
          if ! node -e "const [req, curRaw] = ['${REQUIRED_NPM}', '${CURRENT_NPM}']; const cur = curRaw.split('-')[0].split('+')[0]; const to = (v) => v.split('.').map((n) => Number(n)); const [r1, r2, r3] = to(req); const [c1, c2, c3] = to(cur); const ok = c1 > r1 || (c1 === r1 && (c2 > r2 || (c2 === r2 && c3 >= r3))); if (!ok) { process.exit(1); }"; then
            echo "npm raw version: ${CURRENT_NPM}"
            echo "npm ${CURRENT_NPM} is below required ${REQUIRED_NPM} for OIDC publish."
            exit 1
          fi

          VERSION=${GITHUB_REF_NAME#v}
          ACTUAL_VERSION="$(node -p "require('./package.json').version")"
          if [ "${ACTUAL_VERSION}" != "${VERSION}" ]; then
            echo "package.json version ${ACTUAL_VERSION} does not match tag version ${VERSION}."
            exit 1
          fi
          if npm view splatoon-ui@"${VERSION}" version >/dev/null 2>&1; then
            echo "Version ${VERSION} already published. Skipping publish."
            exit 0
          fi
          npm publish --provenance --access public --ignore-scripts
